name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install (lockfile)
        run: npm ci

      - name: typecheck
        run: npx tsc -b --pretty false

      - name: lint (oxlint)
        run: npx oxlint .
        # oxlint is a committed devDependency; findings are warnings surfaced in
        # the log until a rule baseline is agreed.

      - name: unit tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "no 'test' script on this branch — skipped (not a pass)"
          fi

      - name: build
        run: npm run build
